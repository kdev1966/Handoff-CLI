name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: shellcheck install.sh

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Smoke test the installed command
        run: |
          handoff --version
          handoff setup --print-config

  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      HANDOFF_SOURCE: ${{ github.workspace }}
      HANDOFF_NO_SETUP: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install, upgrade and uninstall (sh)
        if: runner.os != 'Windows'
        run: |
          sh install.sh
          "$HOME/.local/bin/handoff" --version
          sh install.sh
          test "$(cat ~/.bashrc ~/.bash_profile 2>/dev/null | grep -c 'Handoff installer')" = 1
          sh install.sh --uninstall
          test ! -e "$HOME/.local/bin/handoff"
          ! cat ~/.bashrc ~/.bash_profile 2>/dev/null | grep -q 'Handoff installer'
      - name: Install, upgrade and uninstall (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-Content -Raw install.ps1 | Invoke-Expression
          & "$env:LOCALAPPDATA\handoff\bin\handoff.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content -Raw install.ps1 | Invoke-Expression
          $bin = "$env:LOCALAPPDATA\handoff\bin"
          $userPath = (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if (@($userPath -split ';' | Where-Object { $_ -eq $bin }).Count -ne 1) { throw 'PATH entry missing or duplicated' }
          $env:HANDOFF_UNINSTALL = '1'
          Get-Content -Raw install.ps1 | Invoke-Expression
          if (Test-Path $bin) { throw 'bin folder still present' }
          $userPath = (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if (($userPath -split ';') -contains $bin) { throw 'PATH entry not removed' }
